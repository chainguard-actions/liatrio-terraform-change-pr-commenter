name: Test empty plan with no resource_changes key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          json-file: ${{ github.workspace }}/tests/fixtures/tf_empty.json
          github-token: fake-token-for-testing
          expand-comment: "false"
          include-plan-job-summary: "false"
          comment-header: "Terraform Plan Changes"
          quiet: "false"
          log-changed-resources: "false"

      - name: Assert comment-body contains no-changes message
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual comment-body:"
          echo "$ACTUAL"
          if ! echo "$ACTUAL" | grep -q "no changes"; then
            echo "FAIL: expected 'no changes' message in comment-body for empty plan"
            exit 1
          fi
          echo "PASS: no-changes message found in comment-body"
