name: Test quiet mode with changes still outputs comment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture plan file
        run: cp "$GITHUB_WORKSPACE/tests/fixtures/tf_with_create.json" "$GITHUB_WORKSPACE/tfplan.json"

      - id: action
        uses: .
        with:
          json-file: ${{ github.workspace }}/tfplan.json
          github-token: ${{ github.token }}
          quiet: "true"

      - name: Assert comment-body is not empty in quiet mode when there are changes
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual: $ACTUAL"
          if [ -n "$ACTUAL" ]; then
            echo "PASS: comment-body is non-empty as expected in quiet mode with changes"
          else
            echo "FAIL: expected non-empty comment-body in quiet mode when there are changes"
            exit 1
          fi

      - name: Assert comment-body contains create section
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q "Resources to create"; then
            echo "PASS: 'Resources to create' found in comment-body"
          else
            echo "FAIL: expected 'Resources to create' in comment-body"
            exit 1
          fi
