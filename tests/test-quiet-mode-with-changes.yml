name: Test quiet mode with changes still produces output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          json-file: ${{ github.workspace }}/tests/fixtures/tf_with_changes.json
          github-token: fake-token-for-testing
          expand-comment: "false"
          include-plan-job-summary: "false"
          comment-header: "Terraform Plan Changes"
          quiet: "true"
          log-changed-resources: "false"

      - name: Assert comment-body is non-empty in quiet mode when there are changes
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual comment-body:"
          echo "$ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty comment-body in quiet mode when changes exist"
            exit 1
          fi
          echo "PASS: comment-body is non-empty as expected"

      - name: Assert comment-body contains resource changes
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "Terraform Plan:"; then
            echo "FAIL: expected 'Terraform Plan:' in comment-body"
            exit 1
          fi
          echo "PASS: Terraform Plan summary found in comment-body"
