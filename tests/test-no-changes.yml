name: Test no resource changes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture plan file
        run: cp "$GITHUB_WORKSPACE/tests/fixtures/tf_no_changes.json" "$GITHUB_WORKSPACE/tfplan.json"

      - id: action
        uses: .
        with:
          json-file: ${{ github.workspace }}/tfplan.json
          github-token: ${{ github.token }}
          expand-comment: "false"
          include-plan-job-summary: "false"

      - name: Assert comment-body contains no-changes message
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q "There were no changes done to the infrastructure"; then
            echo "PASS: no-changes message found in comment-body"
          else
            echo "FAIL: expected 'There were no changes done to the infrastructure' in comment-body"
            exit 1
          fi
