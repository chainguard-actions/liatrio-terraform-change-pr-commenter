name: Test custom comment header
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture plan file
        run: cp "$GITHUB_WORKSPACE/tests/fixtures/tf_with_create.json" "$GITHUB_WORKSPACE/tfplan.json"

      - id: action
        uses: .
        with:
          json-file: ${{ github.workspace }}/tfplan.json
          github-token: ${{ github.token }}
          comment-header: "My Custom Terraform Header"
          comment-footer: "My Custom Footer"

      - name: Assert comment-body contains custom header
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q "My Custom Terraform Header"; then
            echo "PASS: custom header found in comment-body"
          else
            echo "FAIL: expected 'My Custom Terraform Header' in comment-body"
            exit 1
          fi

      - name: Assert comment-body contains custom footer
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q "My Custom Footer"; then
            echo "PASS: custom footer found in comment-body"
          else
            echo "FAIL: expected 'My Custom Footer' in comment-body"
            exit 1
          fi
